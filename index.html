<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Inter,Helvetica,Arial,sans-serif;background:#fff;color:#111;font-size:12px;}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}
#topfixed{position:sticky;top:0;z-index:50;background:#fff;}
#bar{background:#fff;border-bottom:1px solid #e0e0e0;padding:6px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#bar strong{font-size:14px;letter-spacing:1px;margin-right:4px;color:#0D1F2D;}
.sep{width:1px;height:18px;background:#ddd;flex-shrink:0;}
.fld{display:flex;flex-direction:column;gap:1px;}
.fld span{font-size:9px;color:#999;text-transform:uppercase;letter-spacing:.5px;}
.fld input,.fld select{border:1px solid #ddd;border-radius:3px;padding:3px 7px;font-size:12px;font-family:inherit;outline:none;background:#fff;}
.searchwrap{position:relative;}
.searchinp{border:1px solid #ddd;border-radius:3px;padding:4px 8px;font-size:12px;font-family:inherit;outline:none;}
.searchinp.sel{border-color:#2a7a2a;background:#f2faf2;color:#1a6a1a;}
.drop{display:none;position:absolute;top:100%;left:0;background:#fff;border:1px solid #ddd;border-radius:3px;z-index:200;max-height:280px;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:260px;}
.di{padding:5px 10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f0f0;font-size:12px;gap:8px;}
.di:hover{background:#f5f5f5;}
.di small{color:#aaa;font-size:10px;}
.di .cat{font-size:9px;padding:1px 6px;border-radius:8px;background:#eef;color:#557;}
.btn{padding:4px 14px;border:none;border-radius:3px;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit;}
.btn-k{background:#0D1F2D;color:#fff;}
.btn-b{background:#1a5fa8;color:#fff;}
.btn-p{background:#7c3aed;color:#fff;}
.disc{width:46px;height:20px;border:1px solid #ddd;border-radius:2px;text-align:center;font-size:10px;font-family:inherit;outline:none;background:#fff;color:#555;padding:0;}
.disc:focus{border-color:#1a5fa8;background:#f0f6ff;}
.disc.act{border-color:#e67e22;background:#fff8f0;color:#c0392b;font-weight:600;}
#openModels{padding:6px 12px;background:#fafafa;border-bottom:1px solid #e0e0e0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:34px;}
.mchip{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:14px;border:1px solid #d0d0d0;background:#fff;cursor:pointer;font-size:11px;white-space:nowrap;}
.mchip:hover{border-color:#0D1F2D;}
.mchip.has{border-color:#2a7a2a;background:#f2faf2;}
.mchip .x{color:#bbb;font-weight:700;margin-left:2px;}
.mchip .x:hover{color:#c0392b;}
.mchip .ct{font-size:9px;color:#2a7a2a;font-weight:700;}
.catfilter{display:flex;gap:4px;margin-left:auto;}
.catbtn{padding:3px 10px;border-radius:12px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:10px;font-weight:600;color:#888;font-family:inherit;}
.catbtn.on{background:#0D1F2D;color:#fff;border-color:#0D1F2D;}
#grid{overflow-x:auto;padding-bottom:60px;}
table{border-collapse:collapse;}
td,th{padding:0;}
.sl0{position:sticky;left:0;z-index:4;}
.sl1{position:sticky;left:130px;z-index:4;}
.qi{width:40px;height:26px;border:1px solid #e0e0e0;border-radius:2px;text-align:center;font-size:12px;font-family:inherit;outline:none;background:#fff;color:#111;}
.qi:focus{border-color:#333;background:#fafafa;}
.qi.v{border-color:#2a7a2a;background:#f0f8f0;color:#1a6a1a;font-weight:600;}
.cb{border:1px solid #ddd;border-radius:2px;background:#f9f9f9;padding:1px 6px;font-size:10px;cursor:pointer;font-family:inherit;color:#666;}
.cb:hover{background:#eee;color:#111;}
.cb.act{border-color:#2a7a2a;color:#1a6a1a;background:#f0f8f0;}
.modelhdr{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0D1F2D;color:#fff;position:sticky;left:0;}
.modelhdr h2{font-size:14px;font-weight:700;letter-spacing:.5px;}
.modelhdr .close{margin-left:auto;cursor:pointer;background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:3px;padding:3px 10px;font-size:11px;font-family:inherit;}
.modelhdr .close:hover{background:rgba(255,255,255,.3);}
.emptyState{padding:60px 20px;text-align:center;color:#bbb;}
.emptyState h3{font-size:16px;font-weight:600;color:#999;margin-bottom:6px;}
#toast{display:none;position:fixed;top:12px;right:12px;z-index:999;padding:7px 14px;border-radius:3px;font-size:12px;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);}
#odooModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:2px;}
#viewtabs{display:flex;gap:2px;padding:6px 12px 0;background:#fafafa;border-bottom:1px solid #e0e0e0;}
.vtab{padding:6px 20px;border:1px solid #e0e0e0;border-bottom:none;border-radius:6px 6px 0 0;background:#fff;cursor:pointer;font-size:12px;font-weight:700;color:#888;font-family:inherit;position:relative;top:1px;}
.vtab.on{background:#0D1F2D;color:#fff;border-color:#0D1F2D;}
#pricelist{padding:16px 22px 70px;max-width:920px;}
.plhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.plhead h2{font-size:16px;font-weight:800;color:#0D1F2D;letter-spacing:.5px;margin-right:6px;}
.plmeta{font-size:11px;color:#888;}
.plfilter{display:flex;gap:4px;margin-left:auto;align-items:center;}
.plcat{padding:3px 10px;border-radius:12px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:10px;font-weight:600;color:#888;font-family:inherit;}
.plcat.on{background:#0D1F2D;color:#fff;border-color:#0D1F2D;}
.pltoggle{display:flex;align-items:center;gap:5px;font-size:11px;color:#555;cursor:pointer;user-select:none;padding-left:6px;border-left:1px solid #e0e0e0;margin-left:2px;}
.plbtn{padding:4px 12px;border:1px solid #d0d0d0;border-radius:3px;background:#fff;cursor:pointer;font-size:11px;font-weight:700;color:#555;font-family:inherit;}
.plbtn:hover{border-color:#0D1F2D;color:#0D1F2D;}
table.pltab{border-collapse:collapse;width:100%;font-size:12px;margin-bottom:8px;}
table.pltab th{text-align:left;font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.4px;padding:6px 10px;border-bottom:2px solid #e0e0e0;}
table.pltab td{padding:6px 10px;border-bottom:1px solid #f0f0f0;}
table.pltab td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
table.pltab tr:hover td{background:#fafcff;}

</div>

<div id="viewtabs">

      <button id="odooSend" class="btn btn-p">Order aanmaken in Odoo</button>
    </div>
  </div>
</div>

// ── STATE ─────────────────────────────────────────────────────────────────────
var Q={};                 // "model§color§hval_vval" -> qty
var openModels=[];        // list of model names currently open in grid
var activeClient=null;
var clip=null;            // {type, data, label}
var DISC_COLOR={};        // "model§color" -> %
var DISC_MODEL={};        // "model" -> %
var catFilter="all";

// ── HELPERS ───────────────────────────────────────────────────────────────────
function K(m,c,h,v){return m+"\u00A7"+c+"\u00A7"+h+"_"+v;}
function getQ(m,c,h,v){return Q[K(m,c,h,v)]||0;}
function setQ(m,c,h,v,val){var n=parseInt(val,10);Q[K(m,c,h,v)]=isNaN(n)||n<0?0:n;}
function colorSum(m,c){
  var md=DATA[m],s=0;
  md.h_axis.forEach(function(h){md.v_axis.forEach(function(v){s+=getQ(m,c,h,v);});});
  return s;
}
function modelSum(m){var s=0;Object.keys(DATA[m].colors).forEach(function(c){s+=colorSum(m,c);});return s;}
function totalAll(){return MODEL_NAMES.reduce(function(s,m){return s+modelSum(m);},0);}

function getEffectiveDisc(m,c){
  var dOrder=parseFloat(document.getElementById("disc_order").value)||0;
  if(dOrder>0)return dOrder;
  var dModel=parseFloat(DISC_MODEL[m])||0;
  if(dModel>0)return dModel;
  return parseFloat(DISC_COLOR[m+"\u00A7"+c])||0;
}
function calcVKP(m,c,qty){var vkp=DATA[m].vkp||0;var d=getEffectiveDisc(m,c);return qty*vkp*(1-d/100);}
function calcRetail(m,c,qty){return qty*(DATA[m].retail||0);}

function notify(msg,ok){
  var t=document.getElementById("toast");
  t.textContent=msg;t.style.background=(ok===false)?"#aa2222":"#1a6a1a";
  t.style.display="block";clearTimeout(t._t);
  t._t=setTimeout(function(){t.style.display="none";},2000);
}

// ── CLIENT SEARCH ─────────────────────────────────────────────────────────────
var cinput=document.getElementById("cinput"),cdrop=document.getElementById("cdrop");
function renderClientDrop(q){
  var list=q?CONTACTS.filter(function(c){return c.name.toLowerCase().indexOf(q)>=0||c.city.toLowerCase().indexOf(q)>=0;}):CONTACTS;
  cdrop.innerHTML="";
  list.slice(0,50).forEach(function(c){
    var d=document.createElement("div");d.className="di";
    d.innerHTML="<span>"+c.name+"</span><small>"+c.city+"</small>";
    d.addEventListener("mousedown",function(){activeClient=c;cinput.value=c.name;cinput.className="searchinp sel";cdrop.style.display="none";updateTotals();});
    cdrop.appendChild(d);
  });
  cdrop.style.display=list.length?"block":"none";
}
cinput.addEventListener("focus",function(){if(activeClient){activeClient=null;cinput.value="";cinput.className="searchinp";}renderClientDrop("");});
cinput.addEventListener("input",function(){renderClientDrop(cinput.value.toLowerCase());});
cinput.addEventListener("blur",function(){setTimeout(function(){cdrop.style.display="none";},150);});

// ── MODEL SEARCH ──────────────────────────────────────────────────────────────
var minput=document.getElementById("minput"),mdrop=document.getElementById("mdrop");
function renderModelDrop(q){
  var list=MODEL_NAMES.filter(function(m){
    if(catFilter!=="all"&&DATA[m].cat!==catFilter)return false;
    if(q&&m.toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  mdrop.innerHTML="";
  list.slice(0,60).forEach(function(m){
    var d=document.createElement("div");d.className="di";
    var isOpen=openModels.indexOf(m)>=0;
    var ncol=Object.keys(DATA[m].colors).length;
    d.innerHTML="<span>"+m+(isOpen?" <small style='color:#2a7a2a'>(open)</small>":"")+"</span><span style='display:flex;gap:6px;align-items:center;'><small>"+ncol+" kl.</small><span class='cat'>"+DATA[m].cat+"</span></span>";
    d.addEventListener("mousedown",function(){openModel(m);minput.value="";mdrop.style.display="none";minput.blur();});
    mdrop.appendChild(d);
  });
  mdrop.style.display=list.length?"block":"none";
}
minput.addEventListener("focus",function(){renderModelDrop(minput.value.toLowerCase());});
minput.addEventListener("input",function(){renderModelDrop(minput.value.toLowerCase());});
minput.addEventListener("blur",function(){setTimeout(function(){mdrop.style.display="none";},150);});

// Category filter
document.querySelectorAll(".catbtn").forEach(function(b){
  b.addEventListener("click",function(){
    catFilter=b.dataset.cat;
    document.querySelectorAll(".catbtn").forEach(function(x){x.classList.remove("on");});
    b.classList.add("on");
    renderOpenChips();
    if(mdrop.style.display==="block")renderModelDrop(minput.value.toLowerCase());
  });
});

// ── OPEN MODELS MANAGEMENT ────────────────────────────────────────────────────
function openModel(m){
  if(openModels.indexOf(m)<0)openModels.push(m);
  renderGrid();renderOpenChips();
  setTimeout(function(){
    var el=document.getElementById("model_"+cssId(m));
    if(el)el.scrollIntoView({behavior:"smooth",block:"start"});
  },50);
}
function closeModel(m){
  openModels=openModels.filter(function(x){return x!==m;});
  renderGrid();renderOpenChips();
}
function cssId(s){return s.replace(/[^a-zA-Z0-9]/g,"_");}

function renderOpenChips(){
  var wrap=document.getElementById("openModels");
  // keep the search input and cat filter, rebuild chips between them
  // Find existing chips and remove
  Array.prototype.slice.call(wrap.querySelectorAll(".mchip")).forEach(function(c){c.remove();});
  var catDiv=wrap.querySelector(".catfilter");
  // Models with quantities OR open
  var shown=MODEL_NAMES.filter(function(m){return openModels.indexOf(m)>=0||modelSum(m)>0;});
  shown.forEach(function(m){
    var chip=document.createElement("div");
    var mt=modelSum(m);
    chip.className="mchip"+(mt>0?" has":"");
    chip.innerHTML="<span>"+m.split(" ")[0]+"</span>"+(mt>0?"<span class='ct'>"+mt+"</span>":"")+"<span class='x'>&times;</span>";
    chip.querySelector("span:first-child").addEventListener("click",function(){
      if(openModels.indexOf(m)<0)openModels.push(m);
      renderGrid();
      var el=document.getElementById("model_"+cssId(m));
      if(el)el.scrollIntoView({behavior:"smooth",block:"start"});
    });
    chip.querySelector(".x").addEventListener("click",function(e){e.stopPropagation();closeModel(m);});
    wrap.insertBefore(chip,catDiv);
  });
}

// ── GRID RENDERING ────────────────────────────────────────────────────────────
function renderGrid(){
  var host=document.getElementById("grid");
  if(openModels.length===0){
    host.innerHTML="<div class='emptyState'><h3>Nog geen model geopend</h3><div>Zoek hierboven een model en open het om aantallen in te geven.</div></div>";
    return;
  }
  var html="";
  openModels.forEach(function(m){html+=renderModelBlock(m);});
  host.innerHTML=html;
}

function renderModelBlock(m){
  var md=DATA[m];
  var colors=Object.keys(md.colors);
  var H=md.h_axis, V=md.v_axis;
  var hlbl=md.h_label, vlbl=md.v_label;
  var mTotal=modelSum(m);
  var mid=cssId(m);

  var h="<div id='model_"+mid+"'>";
  // Model header bar
  h+="<div class='modelhdr'>";
  h+="<h2>"+m+"</h2>";
  h+="<span style='font-size:10px;opacity:.7;'>"+md.cat+"</span>";
  if(md.vkp>0)h+="<span style='font-size:10px;opacity:.85;'>VKP &#8364;"+md.vkp.toFixed(2)+" &middot; Retail &#8364;"+md.retail.toFixed(2)+"</span>";
  if(mTotal>0)h+="<span style='font-size:11px;font-weight:700;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:8px;'>"+mTotal+" st</span>";
  h+="<button class='close' data-close='"+encodeURIComponent(m)+"'>&times; sluiten</button>";
  h+="</div>";

  h+="<table><tbody>";
  colors.forEach(function(c,ci){
    var cTotal=colorSum(m,c);
    var dot=CDOT[c]||"#999";
    var pr={vkp:md.vkp,retail:md.retail};
    if(ci>0)h+="<tr><td colspan='"+(H.length+4)+"' style='height:2px;background:#e0e0e0;padding:0;font-size:0;line-height:0;'></td></tr>";

    // Color + H-axis header row
    var dcVal=DISC_COLOR[m+"\u00A7"+c]||"";
    h+="<tr style='background:#f0f0f0;'>";
    h+="<td class='sl0' style='background:#f0f0f0;border-right:1px solid #ddd;padding:3px 6px;width:130px;min-width:130px;'>";
    h+="<div style='display:flex;align-items:center;gap:5px;'>";
    h+="<div style='width:8px;height:8px;border-radius:50%;background:"+dot+";border:1px solid rgba(0,0,0,.12);flex-shrink:0;'></div>";
    h+="<span style='font-size:10px;font-weight:700;color:#333;'>"+c+"</span>";
    if(cTotal>0)h+="<span style='font-size:9px;color:#2a7a2a;font-weight:700;'>"+cTotal+"</span>";
    h+="</div>";
    if(md.vkp>0)h+="<div style='margin-top:2px;padding-left:13px;font-size:9px;color:#555;'>VKP <b>&#8364;"+md.vkp.toFixed(2)+"</b> <span style='color:#888;'>Retail &#8364;"+md.retail.toFixed(2)+"</span></div>";
    h+="</td>";
    h+="<td class='sl1' style='background:#f0f0f0;border-right:2px solid #ccc;padding:3px 4px;width:40px;'></td>";
    H.forEach(function(hv){h+="<td style='background:#f0f0f0;text-align:center;padding:3px 2px;width:44px;'><span style='font-size:10px;font-weight:600;color:#777;'>"+hlbl+hv+"</span></td>";});
    h+="<td style='background:#f0f0f0;border-left:1px solid #ddd;width:32px;'></td>";
    h+="<td style='background:#f0f0f0;padding:1px 4px;white-space:nowrap;'>";
    h+="<div style='display:flex;gap:4px;align-items:center;'>";
    h+="<button class='cb' data-act='copyGrid' data-m='"+encodeURIComponent(m)+"' data-c='"+ci+"'>&#8664; grid</button>";
    if(clip&&clip.type==="grid")h+="<button class='cb act' data-act='pasteGrid' data-m='"+encodeURIComponent(m)+"' data-c='"+ci+"'>&#8665;</button>";

        h+=" data-m='"+encodeURIComponent(m)+"' data-c='"+ci+"' data-hi='"+hi+"' data-vi='"+vi+"'";
        h+=" id='inp_"+mid+"_"+ci+"_"+vi+"_"+hi+"'></td>";
      });
      h+="<td style='border-left:1px solid #e8e8e8;text-align:center;padding:0 4px;font-size:11px;font-weight:"+(rTot>0?700:400)+";color:"+(rTot>0?"#1a6a1a":"#ddd")+";width:32px;' id='rt_"+mid+"_"+ci+"_"+vi+"'>"+(rTot||"")+"</td>";

    });

    // Totals row
    var disc=getEffectiveDisc(m,c);
    var vkpTot=cTotal*(md.vkp||0)*(1-disc/100);
    var discLabel=disc>0?" <span style='font-size:9px;color:#c0392b;'>-"+disc+"%</span>":"";

    h+="<td class='sl1' style='background:#f5f5f5;border-right:2px solid #ccc;border-top:1px solid #eee;'></td>";
    H.forEach(function(hv,hi){
      var t=V.reduce(function(s,vv){return s+getQ(m,c,hv,vv);},0);
      h+="<td id='ct_"+mid+"_"+ci+"_"+hi+"' style='text-align:center;font-size:10px;font-weight:"+(t>0?600:400)+";color:"+(t>0?"#2a7a2a":"#e8e8e8")+";background:#f5f5f5;border-top:1px solid #eee;padding:2px;'>"+(t||"&#183;")+"</td>";
    });
    h+="<td id='gt_"+mid+"_"+ci+"' style='background:#f5f5f5;border-top:1px solid #eee;border-left:1px solid #eee;text-align:center;font-size:11px;font-weight:700;color:"+(cTotal>0?"#1a6a1a":"#ddd")+";padding:2px 4px;'>"+(cTotal||"")+"</td>";

  h+="</tbody></table></div>";

}

var gridEl=document.getElementById("grid");
gridEl.addEventListener("click",function(e){
  var cb=e.target.closest("button[data-close]");
  if(cb){closeModel(decodeURIComponent(cb.dataset.close));return;}

  if(act==="copyRow")copyRow(m,ci,parseInt(btn.dataset.v));
  else if(act==="pasteRow")pasteRow(m,ci,parseInt(btn.dataset.v));
  else if(act==="copyGrid")copyGrid(m,ci);
  else if(act==="pasteGrid")pasteGrid(m,ci);
});
gridEl.addEventListener("change",function(e){
  var el=e.target;
  if(el.classList.contains("qi")){hChange(el);return;}
  if(el.dataset.act==="discColor"){
    var m=decodeURIComponent(el.dataset.m),c=Object.keys(DATA[m].colors)[parseInt(el.dataset.c)];
    var v=parseFloat(el.value)||0;
    if(v>0){DISC_COLOR[m+"\u00A7"+c]=v;el.classList.add("act");}

gridEl.addEventListener("keydown",function(e){

// ── INPUT CHANGE ──────────────────────────────────────────────────────────────
function hChange(el){
  var m=decodeURIComponent(el.dataset.m),ci=parseInt(el.dataset.c),hi=parseInt(el.dataset.hi),vi=parseInt(el.dataset.vi);
  var md=DATA[m],c=Object.keys(md.colors)[ci],hv=md.h_axis[hi],vv=md.v_axis[vi];
  setQ(m,c,hv,vv,el.value);
  var val=getQ(m,c,hv,vv);el.value=val||"";el.className="qi"+(val>0?" v":"");
  var mid=cssId(m);
  var rt=document.getElementById("rt_"+mid+"_"+ci+"_"+vi);
  if(rt){var rs=md.h_axis.reduce(function(s,h){return s+getQ(m,c,h,vv);},0);rt.textContent=rs||"";rt.style.color=rs>0?"#1a6a1a":"#ddd";rt.style.fontWeight=rs>0?700:400;}
  var ct=document.getElementById("ct_"+mid+"_"+ci+"_"+hi);
  if(ct){var cs2=md.v_axis.reduce(function(s,v){return s+getQ(m,c,hv,v);},0);ct.textContent=cs2||"\u00B7";ct.style.color=cs2>0?"#2a7a2a":"#e8e8e8";ct.style.fontWeight=cs2>0?600:400;}
  var gt=document.getElementById("gt_"+mid+"_"+ci);
  if(gt){var gs=colorSum(m,c);gt.textContent=gs||"";gt.style.color=gs>0?"#1a6a1a":"#ddd";
    var vt=gt.nextElementSibling;
    if(vt&&md.vkp>0){var disc=getEffectiveDisc(m,c);var vk=gs*md.vkp*(1-disc/100);var dl=disc>0?" <span style='font-size:9px;color:#c0392b;'>-"+disc+"%</span>":"";vt.innerHTML=gs>0?"<span style='font-size:10px;font-weight:700;color:#1a5fa8;'>&#8364;"+vk.toFixed(2)+"</span>"+dl:"";}
  }
  updateTotals();
}

function onKey(e,m,ci,vi,hi){
  var md=DATA[m],nH=md.h_axis.length,nV=md.v_axis.length,nC=Object.keys(md.colors).length;
  var nc=ci,nv=vi,nh=hi;
  if(e.key==="ArrowRight"||(e.key==="Tab"&&!e.shiftKey)){e.preventDefault();nh++;}
  else if(e.key==="ArrowLeft"||(e.key==="Tab"&&e.shiftKey)){e.preventDefault();nh--;}
  else if(e.key==="ArrowDown"||e.key==="Enter"){e.preventDefault();nv++;}
  else if(e.key==="ArrowUp"){e.preventDefault();nv--;}
  else return;
  if(nh>=nH){nh=0;nv++;}if(nh<0){nh=nH-1;nv--;}
  if(nv>=nV){nv=0;nc++;}if(nv<0){nv=nV-1;nc--;}
  if(nc<0||nc>=nC)return;
  var el=document.getElementById("inp_"+cssId(m)+"_"+nc+"_"+nv+"_"+nh);
  if(el){el.focus();el.select();}
}

// ── COPY / PASTE ──────────────────────────────────────────────────────────────
function copyRow(m,ci,vi){
  var md=DATA[m],c=Object.keys(md.colors)[ci],vv=md.v_axis[vi];
  clip={type:"row",data:md.h_axis.map(function(h){return getQ(m,c,h,vv);}),label:c.split(" ")[0]+" "+(vv==="Size"?"Size":md.v_label+vv)};
  notify("Rij gekopieerd");renderGrid();
}
function pasteRow(m,ci,vi){
  if(!clip||clip.type!=="row"){notify("Geen rij gekopieerd",false);return;}
  var md=DATA[m],c=Object.keys(md.colors)[ci],vv=md.v_axis[vi];
  md.h_axis.forEach(function(h,i){setQ(m,c,h,vv,clip.data[i]||0);});
  notify("Geplakt");renderGrid();updateTotals();
}
function copyGrid(m,ci){
  var md=DATA[m],c=Object.keys(md.colors)[ci],d={};
  md.v_axis.forEach(function(v){md.h_axis.forEach(function(h){d[h+"_"+v]=getQ(m,c,h,v);});});
  clip={type:"grid",srcModel:m,data:d,label:c.split(" ")[0]};
  notify("Grid gekopieerd");renderGrid();
}
function pasteGrid(m,ci){
  if(!clip||clip.type!=="grid"){notify("Geen grid gekopieerd",false);return;}
  var md=DATA[m],c=Object.keys(md.colors)[ci];
  // Only paste cells that exist in target model's axes
  Object.keys(clip.data).forEach(function(k){
    var p=k.split("_");var hv=p[0],vv=p[1];
    // hv may be numeric or string; match against target axes
    var hMatch=md.h_axis.some(function(x){return String(x)===hv;});
    var vMatch=md.v_axis.some(function(x){return String(x)===vv;});
    if(hMatch&&vMatch){
      var hVal=md.h_axis.filter(function(x){return String(x)===hv;})[0];
      var vVal=md.v_axis.filter(function(x){return String(x)===vv;})[0];
      setQ(m,c,hVal,vVal,clip.data[k]);
    }
  });
  notify("Grid geplakt");renderGrid();updateTotals();
}

// ── TOTALS ────────────────────────────────────────────────────────────────────
function updateTotals(){
  var t=totalAll(),vkpTotal=0,retailTotal=0;
  MODEL_NAMES.forEach(function(m){
    Object.keys(DATA[m].colors).forEach(function(c){
      var qty=colorSum(m,c);
      vkpTotal+=calcVKP(m,c,qty);retailTotal+=calcRetail(m,c,qty);
    });
  });
  var el=document.getElementById("totlbl");
  if(t>0){
    var dOrder=parseFloat(document.getElementById("disc_order").value)||0;
    var anyDisc=dOrder>0;
    if(!anyDisc)Object.keys(DISC_MODEL).forEach(function(k){if(DISC_MODEL[k]>0)anyDisc=true;});
    if(!anyDisc)Object.keys(DISC_COLOR).forEach(function(k){if(DISC_COLOR[k]>0)anyDisc=true;});
    var discStr="";
    if(dOrder>0)discStr=" <span style='color:#c0392b;font-size:10px;'>(-"+dOrder+"%)</span>";
    else if(anyDisc)discStr=" <span style='color:#c0392b;font-size:10px;'>(-korting)</span>";
    el.innerHTML="<b>"+t+" st</b>&nbsp;&nbsp;<span style='color:#555;font-weight:400;'>VKP <b>&#8364;"+vkpTotal.toFixed(2)+"</b>"+discStr+"</span>";
  }else el.innerHTML="";
  var mg=document.getElementById("marginlbl");
  if(t>0&&vkpTotal>0&&retailTotal>0){mg.textContent="Klantmarge \u20AC"+(retailTotal-vkpTotal).toFixed(2);mg.style.display="inline";}
  else mg.style.display="none";
  var cl=document.getElementById("cliplbl");
  if(clip){cl.textContent="\uD83D\uDCCB "+clip.label;cl.style.display="inline";}else cl.style.display="none";
  renderOpenChips();
}

// ── ORDER META ────────────────────────────────────────────────────────────────
function getOrderMeta(){
  var date=document.getElementById("fdate").value||new Date().toISOString().slice(0,10);
  var typeEl=document.getElementById("ftype"),typeVal=typeEl.options[typeEl.selectedIndex].text;
  var season=document.getElementById("fseason").value,brand=document.getElementById("fbrand").value;
  var slug=activeClient?activeClient.name.replace(/[^a-zA-Z0-9]/g,"_").slice(0,20):"ORDER";
  var delivery=document.getElementById("fdelivery").value.trim();
  var delivdate=document.getElementById("fdelivdate").value||"2027-07-01";
  return {date:date,typeVal:typeVal,season:season,brand:brand,ref:"SO-"+date+"-"+slug,delivery:delivery,delivdate:delivdate};
}

// ── CSV EXPORT ────────────────────────────────────────────────────────────────
function buildCSV(){
  var meta=getOrderMeta();
  var rows=[["Sales Order/Externe ID","Orderregels/Product/Externe ID","Orderregels/Aantal","Klant/Externe ID","Orderdatum","Type","Seizoen","Merk","Leveradres","Gevr. leverdatum"]];
  var any=false;
  MODEL_NAMES.forEach(function(m){var md=DATA[m];Object.keys(md.colors).forEach(function(c){
    md.v_axis.forEach(function(vv){md.h_axis.forEach(function(hv){
      var q=getQ(m,c,hv,vv);if(!q)return;
      var p=md.colors[c][hv+"_"+vv];if(!p)return;
      rows.push([meta.ref,p,q,activeClient.id,meta.date,meta.typeVal,meta.season,meta.brand,meta.delivery,meta.delivdate]);any=true;
    });});
  });});
  if(!any)return null;
  var csv=rows.map(function(r){return r.join(",");}).join("\n");
  return {blob:new Blob([csv],{type:"text/csv"}),filename:"zilton_"+activeClient.name.replace(/[^a-zA-Z0-9]/g,"_")+"_"+meta.date+".csv"};
}
function downloadBlob(blob,filename){
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}

// ── PDF EXPORT ────────────────────────────────────────────────────────────────
function collectOrdered(){
  var ordered={};var anyQty=false;
  MODEL_NAMES.forEach(function(m){var md=DATA[m];Object.keys(md.colors).forEach(function(c){
    md.v_axis.forEach(function(vv){
      var row={};var has=false;
      md.h_axis.forEach(function(hv){var q=getQ(m,c,hv,vv);if(q){row[hv]=q;has=true;}});
      if(has){anyQty=true;if(!ordered[m])ordered[m]={};if(!ordered[m][c])ordered[m][c]={};ordered[m][c][vv]=row;}
    });
  });});
  return anyQty?ordered:null;
}

function generatePDF(ordered){
  var meta=getOrderMeta();
  var jsPDF=window.jspdf.jsPDF;
  var doc=new jsPDF({orientation:"landscape",unit:"pt",format:"a4"});
  var PW=841.89,PH=595.28,ML=28,MR=28,MT=28,usableW=PW-56;
  var NAV=[13,31,45];

  function phdr(){
    doc.setFillColor(NAV[0],NAV[1],NAV[2]);doc.rect(ML,MT-4,usableW,28,"F");
    try{doc.addImage("data:image/png;base64,"+LOGO_B64,"PNG",ML+4,MT-2,28,24);}catch(e){}
    doc.setFont("helvetica","normal");doc.setFontSize(6.5);doc.setTextColor(180,200,220);doc.text("SALES ORDER",ML+36,MT+10);
    var clientLine=activeClient.name+(meta.delivery?" \u2192 "+meta.delivery:"");
    var m2=[clientLine,meta.ref,meta.date+"  \u00B7  "+meta.typeVal+"  \u00B7  Lever: "+meta.delivdate,meta.season+"  \u00B7  "+meta.brand];
    var rx=PW-MR;doc.setFontSize(7);
    m2.forEach(function(line,i){
      if(i===0){doc.setFont("helvetica","bold");doc.setTextColor(255,255,255);}
      else{doc.setFont("helvetica","normal");doc.setTextColor(160,185,215);}
      doc.text(line,rx-doc.getTextWidth(line),MT+3+i*6.5);
    });
    doc.setTextColor(0,0,0);return MT+28+8;
  }

  var y=phdr();
  var ordModels=Object.keys(ordered);
  var grandVKP=0,grand=0;
  var summaryRows=[];

  ordModels.forEach(function(m){
    var md=DATA[m];
    var H=md.h_axis,hlbl=md.h_label;
    var CLW=95,LLW=26,TOTW=24;
    var DCW=Math.min(30,(usableW-CLW-LLW-TOTW)/H.length);
    var TBW=CLW+LLW+H.length*DCW+TOTW;
    var ROW=12,CHDR=md.vkp>0?20:14,MHDR=17;

    function whdr(yy){
      doc.setFillColor(235,240,245);doc.rect(ML,yy,TBW,10,"F");
      doc.setFont("helvetica","bold");doc.setFontSize(6);doc.setTextColor(120,120,120);
      var cx=ML+CLW+LLW;
      H.forEach(function(hv){doc.text(hlbl+hv,cx+DCW/2,yy+7,{align:"center"});cx+=DCW;});
      doc.text("Sig",cx+TOTW/2,yy+7,{align:"center"});
      doc.setTextColor(0,0,0);return yy+10;
    }

    var cols=Object.keys(ordered[m]);
    var mQty=0;cols.forEach(function(c){Object.keys(ordered[m][c]).forEach(function(vv){Object.keys(ordered[m][c][vv]).forEach(function(hv){mQty+=ordered[m][c][vv][hv];});});});
    var mDisc=parseFloat(document.getElementById("disc_order").value)||parseFloat(DISC_MODEL[m])||0;
    var mVKP=mQty*(md.vkp||0)*(1-mDisc/100);
    grandVKP+=mVKP;grand+=mQty;
    summaryRows.push({m:m,vkp:md.vkp,retail:md.retail,qty:mQty,total:mVKP});

    if(y+MHDR+10+CHDR+ROW>PH-MR){doc.addPage();y=phdr();}

    // Model header
    doc.setFillColor(NAV[0],NAV[1],NAV[2]);doc.rect(ML,y,TBW,MHDR,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(255,255,255);
    doc.text(m,ML+5,y+MHDR*0.66);
    doc.setFontSize(6.5);
    var mline=mQty+" st";if(md.vkp>0)mline+="  |  VKP \u20AC"+mVKP.toFixed(2);
    doc.text(mline,ML+TBW-4,y+MHDR*0.66,{align:"right"});
    doc.setTextColor(0,0,0);y+=MHDR;
    y=whdr(y);

    cols.forEach(function(c){
      var vlist=Object.keys(ordered[m][c]);
      var cT=0;vlist.forEach(function(vv){Object.keys(ordered[m][c][vv]).forEach(function(hv){cT+=ordered[m][c][vv][hv];});});
      if(y+CHDR+vlist.length*ROW>PH-MR){doc.addPage();y=phdr();y=whdr(y);}
      doc.setFillColor(248,248,248);doc.rect(ML,y,TBW,CHDR,"F");
      var rgb=CDOT_RGB[c]||[150,150,150];
      doc.setFillColor(rgb[0],rgb[1],rgb[2]);doc.circle(ML+6,y+CHDR/2,3,"F");
      doc.setFont("helvetica","bold");doc.setFontSize(7);doc.setTextColor(51,51,51);
      doc.text(c,ML+13,md.vkp>0?y+CHDR*0.42:y+CHDR*0.62);
      if(md.vkp>0){
        doc.setFont("helvetica","normal");doc.setFontSize(6.5);doc.setTextColor(80,80,80);
        doc.text("VKP \u20AC"+md.vkp.toFixed(2)+"  |  Retail \u20AC"+md.retail.toFixed(2),ML+13,y+CHDR*0.42+5.5);
      }
      var effDisc=getEffectiveDisc(m,c);var discTxt=effDisc>0?" (-"+effDisc+"%)":"";
      doc.setFont("helvetica","bold");doc.setTextColor(26,106,26);doc.setFontSize(6.5);
      doc.text(cT+" st"+discTxt,ML+TBW-3,md.vkp>0?y+CHDR*0.42:y+CHDR*0.62,{align:"right"});
      doc.setTextColor(0,0,0);doc.setDrawColor(220,220,220);doc.line(ML,y+CHDR,ML+TBW,y+CHDR);y+=CHDR;

      vlist.forEach(function(vv,vi){
        var row=ordered[m][c][vv];
        var rT=0;Object.keys(row).forEach(function(hv){rT+=row[hv];});
        if(vi%2===1){doc.setFillColor(250,250,250);doc.rect(ML,y,TBW,ROW,"F");}
        doc.setFont("helvetica","bold");doc.setFontSize(6.5);doc.setTextColor(150,150,150);
        var vlabel=(vv==="Size")?"Size":(md.v_label+vv);
        doc.text(vlabel,ML+CLW+LLW-2,y+ROW*0.7,{align:"right"});
        var cx=ML+CLW+LLW;
        H.forEach(function(hv){
          var v=row[hv]||0;
          if(v>0){doc.setTextColor(26,106,26);doc.setFont("helvetica","bold");doc.setFontSize(7);doc.text(String(v),cx+DCW/2,y+ROW*0.7,{align:"center"});}
          else{doc.setTextColor(215,215,215);doc.setFont("helvetica","normal");doc.setFontSize(6);doc.text(".",cx+DCW/2,y+ROW*0.7,{align:"center"});}
          cx+=DCW;
        });
        doc.setFont("helvetica","bold");doc.setFontSize(7);doc.setTextColor(17,17,17);
        doc.text(String(rT),cx+TOTW/2,y+ROW*0.7,{align:"center"});
        doc.setTextColor(0,0,0);doc.setDrawColor(238,238,238);doc.line(ML,y+ROW,ML+TBW,y+ROW);y+=ROW;
      });
      y+=3;
    });
    y+=8;
  });

  // Summary table
  if(y+20+(summaryRows.length+2)*12>PH-MR){doc.addPage();y=phdr()+6;}else y+=6;
  var TBW2=usableW;
  var c0=ML,c1=ML+200,c2=ML+260,c3=ML+320,c4=ML+400;
  doc.setFillColor(230,235,240);doc.rect(ML,y,TBW2,11,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(7);doc.setTextColor(NAV[0],NAV[1],NAV[2]);
  doc.text("Model",c0+3,y+7.5);doc.text("VKP/st",c1,y+7.5,{align:"right"});
  doc.text("Retail/st",c2,y+7.5,{align:"right"});doc.text("Qty",c3,y+7.5,{align:"right"});
  doc.text("VKP totaal",c4,y+7.5,{align:"right"});y+=11;
  summaryRows.forEach(function(r,idx){
    if(idx%2===0){doc.setFillColor(250,250,250);doc.rect(ML,y,TBW2,11,"F");}
    doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor(30,30,30);
    doc.text(r.m,c0+3,y+7.5);
    doc.text(r.vkp>0?"\u20AC"+r.vkp.toFixed(2):"-",c1,y+7.5,{align:"right"});
    doc.text(r.retail>0?"\u20AC"+r.retail.toFixed(2):"-",c2,y+7.5,{align:"right"});
    doc.text(String(r.qty),c3,y+7.5,{align:"right"});
    doc.setFont("helvetica","bold");doc.text(r.vkp>0?"\u20AC"+r.total.toFixed(2):"-",c4,y+7.5,{align:"right"});
    doc.setDrawColor(235,235,235);doc.line(ML,y+11,ML+TBW2,y+11);y+=11;
  });
  doc.setFillColor(NAV[0],NAV[1],NAV[2]);doc.rect(ML,y,TBW2,13,"F");
  doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor(255,255,255);
  doc.text("TOTAAL",c0+3,y+9);doc.text(String(grand),c3,y+9,{align:"right"});
  doc.text("\u20AC"+grandVKP.toFixed(2),c4,y+9,{align:"right"});

  return {blob:doc.output("blob"),filename:"zilton_"+activeClient.name.replace(/[^a-zA-Z0-9]/g,"_")+"_"+meta.date+".pdf"};
}

// ── ODOO ──────────────────────────────────────────────────────────────────────
var ODOO_URL="https://odoo.lvfashion.be";
function odooRPC(model,method,args,kwargs){
  return fetch(ODOO_URL+"/web/dataset/call_kw",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",
    body:JSON.stringify({jsonrpc:"2.0",method:"call",id:1,params:{model:model,method:method,args:args,kwargs:kwargs||{},context:{}}})
  }).then(function(r){return r.json();}).then(function(r){if(r.error)throw new Error(r.error.data?r.error.data.message:r.error.message);return r.result;});
}
function odooAuth(user,key){
  return fetch(ODOO_URL+"/web/session/authenticate",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",
    body:JSON.stringify({jsonrpc:"2.0",method:"call",id:1,params:{db:"lvfashion",login:user,password:key}})
  }).then(function(r){return r.json();}).then(function(r){if(r.error)throw new Error(r.error.data?r.error.data.message:r.error.message);if(!r.result||!r.result.uid)throw new Error("Inloggen mislukt");return r.result.uid;});
}
function setOdooStatus(msg,color){var el=document.getElementById("odooStatus");el.textContent=msg;el.style.color=color||"#555";}

async function sendToOdoo(){
  if(!activeClient){setOdooStatus("Selecteer eerst een klant","#c00");return;}
  if(totalAll()===0){setOdooStatus("Geen aantallen ingevoerd","#c00");return;}
  var user=document.getElementById("odooUser").value.trim(),key=document.getElementById("odooKey").value.trim();
  if(!user||!key){setOdooStatus("Vul gebruikersnaam en API sleutel in","#c00");return;}
  var btn=document.getElementById("odooSend");btn.disabled=true;btn.textContent="Bezig...";
  try{
    setOdooStatus("Inloggen...","#555");await odooAuth(user,key);
    setOdooStatus("Merk ophalen...","#555");
    var brands=await odooRPC("product.brand","search_read",[[["name","=",document.getElementById("fbrand").value]]],{fields:["id"],limit:1});
    if(!brands.length)throw new Error("Merk niet gevonden");var brandId=brands[0].id;
    setOdooStatus("Seizoen ophalen...","#555");
    var seasons=await odooRPC("product.season","search_read",[[["name","=",document.getElementById("fseason").value]]],{fields:["id"],limit:1});
    if(!seasons.length)throw new Error("Seizoen niet gevonden");var seasonId=seasons[0].id;
    setOdooStatus("Klant ophalen...","#555");
    var partnerNum=parseInt(activeClient.id.match(/res_partner_(\d+)/)[1]);
    var partners=await odooRPC("res.partner","search_read",[[["id","=",partnerNum]]],{fields:["id"],limit:1});
    if(!partners.length)throw new Error("Klant niet gevonden");var partnerId=partners[0].id;
    setOdooStatus("Orderlijnen samenstellen...","#555");
    var lines=[];
    MODEL_NAMES.forEach(function(m){var md=DATA[m];Object.keys(md.colors).forEach(function(c){
      md.v_axis.forEach(function(vv){md.h_axis.forEach(function(hv){
        var q=getQ(m,c,hv,vv);if(!q)return;
        var ext=md.colors[c][hv+"_"+vv];if(!ext)return;
        var pn=parseInt(ext.match(/product_product_(\d+)/)[1]);
        lines.push([0,0,{product_id:pn,product_uom_qty:q,price_unit:0}]);
      });});
    });});
    var meta=getOrderMeta();
    setOdooStatus("Order aanmaken ("+lines.length+" lijnen)...","#555");
    var orderId=await odooRPC("sale.order","create",[{partner_id:partnerId,date_order:meta.date+" 08:00:00",product_brand_id:brandId,product_season_id:seasonId,use_grid_entry:true,order_line:lines}],{});
    var orders=await odooRPC("sale.order","read",[[orderId]],{fields:["name"]});
    var orderName=orders[0]?orders[0].name:"SO-"+orderId;
    setOdooStatus("\u2713 Order aangemaakt: "+orderName+" ("+lines.length+" lijnen)","#1a6a1a");
    notify("Order "+orderName+" aangemaakt!");btn.textContent="\u2713 Klaar";
  }catch(e){setOdooStatus("Fout: "+e.message,"#c00");btn.disabled=false;btn.textContent="Order aanmaken in Odoo";}
}
document.getElementById("btnOdoo").addEventListener("click",function(){
  if(!activeClient){notify("Selecteer eerst een klant",false);return;}

  document.getElementById("odooStatus").textContent="";

document.getElementById("odooCancel").addEventListener("click",function(){document.getElementById("odooModal").style.display="none";});
document.getElementById("odooSend").addEventListener("click",sendToOdoo);

// ── SEND (CSV + PDF download + email) ─────────────────────────────────────────
document.getElementById("btnSend").addEventListener("click",function(){
  if(!activeClient){notify("Selecteer eerst een klant",false);return;}
  if(totalAll()===0){notify("Geen aantallen ingevoerd",false);return;}
  if(!window.jspdf){notify("jsPDF laadt nog, probeer opnieuw",false);return;}

  var meta=getOrderMeta();

  // 1. Build and download CSV
  var csv=buildCSV();
  if(!csv){notify("Geen aantallen ingevoerd",false);return;}
  downloadBlob(csv.blob,csv.filename);

  // 2. Build and download PDF
  var ordered=collectOrdered();
  var pdf=generatePDF(ordered);
  downloadBlob(pdf.blob,pdf.filename);

  // 3. Compose totals for the email body
  var t=totalAll(),vkpTotal=0;
  MODEL_NAMES.forEach(function(m){Object.keys(DATA[m].colors).forEach(function(c){vkpTotal+=calcVKP(m,c,colorSum(m,c));});});
  var modelLines=[];
  MODEL_NAMES.forEach(function(m){var mt=modelSum(m);if(mt>0)modelLines.push("  - "+m+": "+mt+" st");});

  // 4. Open email with prefilled subject and body
  var subject="Nieuwe order - "+activeClient.name+" - "+meta.ref;
  var body=""
    +"Beste,\n\n"
    +"In bijlage een nieuwe order.\n\n"
    +"Klant: "+activeClient.name+"\n"
    +(meta.delivery?"Leveradres: "+meta.delivery+"\n":"")
    +"Ordernummer: "+meta.ref+"\n"
    +"Orderdatum: "+meta.date+"\n"
    +"Type: "+meta.typeVal+"\n"
    +"Seizoen: "+meta.season+"\n"
    +"Gevraagde leverdatum: "+meta.delivdate+"\n\n"
    +"Modellen:\n"+modelLines.join("\n")+"\n\n"
    +"Totaal: "+t+" stuks - VKP EUR "+vkpTotal.toFixed(2)+"\n\n"
    +"LET OP: voeg de zonet gedownloade bestanden (CSV + PDF) toe als bijlage voor je verzendt.\n\n"
    +"Met vriendelijke groeten";

  var mailto="mailto:customercare@lvfashion.be"
    +"?subject="+encodeURIComponent(subject)
    +"&body="+encodeURIComponent(body);

  // Small delay so downloads start before mail client opens
  setTimeout(function(){window.location.href=mailto;},600);
  notify("CSV + PDF gedownload, mail wordt geopend");
});

var COMP_FLAG={}; // geen te controleren series meer
function serieOf(name){var m=name.match(/\b(\d{1,3})\b/);return m?parseInt(m[1],10):null;}
function compHtml(m){
  var s=serieOf(m);
  if(COMP_FLAG[s])return "<span class='pltbd'>serie "+s+": controleren</span>";
  if(s!==null&&COMP[s])return "<span class='plcomp'>"+COMP[s]+"</span>";
  return "<span style='color:#ccc;'>&mdash;</span>";
}

function renderPricelist(){
  var body=document.getElementById("plBody");
  var models=MODEL_NAMES.filter(function(m){return DATA[m];});
  var total=0, priced=0, tbd=0;
  var groups={};
  models.forEach(function(m){
    var d=DATA[m]; total++;
    if(d.vkp>0&&d.retail>0)priced++;else tbd++;
    var c=d.cat||"Overig"; (groups[c]=groups[c]||[]).push(m);
  });
  var cats=PL_ORDER.filter(function(c){return groups[c];});
  Object.keys(groups).forEach(function(c){if(cats.indexOf(c)<0)cats.push(c);});

  var showMargin=PL_MARGIN;
  var h="<table class='pltab'><thead><tr>"
    +"<th>Model</th>"
    +"<th>Samenstelling</th>"
    +"<th style='text-align:right;'>Kleuren</th>"
    +"<th style='text-align:right;'>VKP (inkoop)</th>"
    +"<th style='text-align:right;'>Retail (advies)</th>"
    +(showMargin?"<th style='text-align:right;'>Marge (&times;)</th>":"")
    +"</tr></thead><tbody>";
  var colspan=showMargin?6:5;
  var shown=0;
  cats.forEach(function(c){
    if(PL_CAT!=="all"&&PL_CAT!==c)return;
    var rows=groups[c]; shown+=rows.length;
    h+="<tr class='plcatrow'><td colspan='"+colspan+"'>"+c+" &middot; "+rows.length+" modellen</td></tr>";
    rows.forEach(function(m){
      var d=DATA[m], has=d.vkp>0&&d.retail>0;
      var ncol=Object.keys(d.colors||{}).length;
      h+="<tr><td class='plmodel'>"+m+"</td><td>"+compHtml(m)+"</td><td class='num plclr'>"+ncol+"</td>";
      if(has){
        h+="<td class='num plvkp'>"+eur(d.vkp)+"</td><td class='num plretail'>"+eur(d.retail)+"</td>";
        if(showMargin){var mg=d.retail/d.vkp;h+="<td class='num plmargin'>"+mg.toFixed(2).replace(".",",")+"</td>";}
      }else{
        h+="<td class='num pltbd' colspan='"+(showMargin?3:2)+"'>nog te bepalen</td>";
      }
      h+="</tr>";
    });
  });
  h+="</tbody></table>";
  if(shown===0)h="<div class='emptyState'><h3>Geen modellen in deze categorie</h3></div>";
  body.innerHTML=h;
  document.getElementById("plMeta").textContent=total+" modellen \u00B7 "+priced+" geprijsd \u00B7 "+tbd+" nog te bepalen";
}
